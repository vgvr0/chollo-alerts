name: chollo-alerts

x-app: &app
  image: chollo-alerts:runtime
  build: .
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_PATH: /app/data/chollometro.sqlite3
  restart: unless-stopped
  volumes:
    - chollometro-data:/app/data

services:
  telegram:
    <<: *app
    command: ["chollo-alerts", "telegram-listen"]

  scanner:
    <<: *app
    command: ["chollo-alerts", "scan"]
    healthcheck:
      test: ["CMD", "chollo-alerts", "health"]
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3

volumes:
  chollometro-data:

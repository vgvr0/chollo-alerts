services:
  chollometro-alerts:
    build: .
    command: ["chollometro-alerts", "run"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_PATH: /data/chollometro.sqlite3
    restart: unless-stopped
    volumes:
      - chollometro-data:/data

volumes:
  chollometro-data:

name: chollo-alerts

x-app: &app
  image: chollo-alerts:runtime
  build: .
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_PATH: /app/data/chollometro.sqlite3
  restart: unless-stopped
  volumes:
    - chollometro-data:/app/data

services:
  telegram:
    <<: *app
    command: ["chollo-alerts", "telegram-listen"]

  scanner:
    <<: *app
    command: ["chollo-alerts", "scan"]
    ports:
      - "${METRICS_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "chollo-alerts", "health"]
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      scanner:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.1.1
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-change-me-locally}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/api/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5

  alertmanager:
    image: prom/alertmanager:v0.28.1
    entrypoint: ["/bin/sh", "/usr/local/bin/alertmanager-entrypoint.sh"]
    env_file:
      - path: .env
        required: false
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./observability/alertmanager/entrypoint.sh:/usr/local/bin/alertmanager-entrypoint.sh:ro
      - alertmanager-data:/alertmanager
    depends_on:
      prometheus:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9093/-/healthy >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  chollometro-data:
  prometheus-data:
  grafana-data:
  alertmanager-data:

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chollometro-alerts"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "beautifulsoup4>=4.12", "pydantic>=2.0", "python-dotenv>=1.0"]

[project.scripts]
chollometro-alerts = "chollometro_alerts.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]

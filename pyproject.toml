[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chollo-alerts"
version = "1.0.0"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "requests>=2.34.2",
    "curl_cffi>=0.16.3",
    "beautifulsoup4>=4.15.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    # `zoneinfo` reads the IANA database from the system; Windows does not ship
    # it, and the notification windows are defined in a real timezone
    # (`Europe/Madrid` by default), so the data is a declared dependency.
    "tzdata>=2026.4",
    "prometheus-client>=0.22.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pip-audit>=2.9",
    "pytest>=8.0",
    "pytest-cov>=7.0",
    "ruff>=0.6",
    "types-requests>=2.31",
]

[project.scripts]
chollo-alerts = "chollometro_alerts.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["live: opt-in network contract checks"]

[tool.setuptools.package-data]
chollometro_alerts = ["i18n/locales/*.json"]

[tool.coverage.run]
source = ["src/chollometro_alerts"]

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.mypy]
# `build/lib` is generated by packaging commands and duplicates the source
# package; type-check the canonical source tree only.
exclude = '(^|[\\\\/])build([\\\\/]|$)'
